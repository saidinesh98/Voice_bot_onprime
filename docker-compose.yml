services:
  db:
    image: postgres:15-alpine
    container_name: voice-bot-db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASS:-root}
      POSTGRES_DB: ${DB_NAME:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  keycloak:
    build:
      context: .
      dockerfile: keycloak.Dockerfile
    container_name: voice-bot-keycloak
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_ENABLED: 'true'
      KC_HOSTNAME_STRICT: 'false'
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-postgres}
      KC_DB_USERNAME: ${DB_USER:-postgres}
      KC_DB_PASSWORD: ${DB_PASS:-root}
    volumes:
      - ./realm-export.json:/opt/keycloak/data/import/realm.json:ro
    ports:
      - "8080:8080"
    depends_on:
      - db

  ollama:
    image: ollama/ollama:latest
    container_name: voice-bot-ollama
    volumes:
      - ollama_data:/root/.ollama
      - ./ollama_init.sh:/entrypoint.sh
    entrypoint: ["/bin/bash", "/entrypoint.sh"]
    ports:
      - "11434:11434"

  llm-server:
    build:
      context: .
      dockerfile: llm_server.Dockerfile
    container_name: voice-bot-llm-server
    environment:
      - OLLAMA_HOST=http://ollama:11434
    ports:
      - "8000:8000"
    depends_on:
      - ollama

  backend:
    build:
      context: .
      dockerfile: backend.Dockerfile
    container_name: voice-bot-backend
    environment:
      - DB_HOST=db
      - DB_NAME=${DB_NAME:-postgres}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASS=${DB_PASS:-root}
      - DB_PORT=5432
      - KEYCLOAK_URL=http://keycloak:8080
      - KEYCLOAK_REALM=${KEYCLOAK_REALM:-aura-ai}
      - KEYCLOAK_CLIENT_ID=${KEYCLOAK_CLIENT_ID:-aura-client}
      - LLM_SERVER_URL=http://llm-server:8000
    ports:
      - "8001:8001"
    depends_on:
      - db
      - keycloak
      - llm-server

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: voice-bot-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: voice-bot-tunnel
    command: tunnel --url http://frontend:80
    depends_on:
      - frontend

volumes:
  postgres_data:
  ollama_data:
